<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama de Classes UML — Observer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; }
    svg { display: block; width: 1024px; height: 504px; }
    .nome { font: 600 12px 'Segoe UI', sans-serif; fill: #2d3142; text-anchor: middle; }
    .membro { font: 9px Consolas, monospace; fill: #2d3142; }
    .rotulo { font: 9px Consolas, monospace; fill: #4f5d75; text-anchor: middle; }
    .caixa { fill: #fff; stroke: #2d3142; stroke-width: 1.4; }
    .cabecalho { fill: #f1f3f5; }
    .divisoria { stroke: #2d3142; stroke-width: 1.2; }
    .conector { fill: none; stroke: #2d3142; stroke-width: 1.4; }
    .realizacao { stroke-dasharray: 5 4; marker-end: url(#observer-triangulo); }
    .dependencia { stroke-dasharray: 4 3; marker-end: url(#observer-aberta); }
  </style>
</head>
<body>
<svg viewBox="0 0 1024 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="observer-title observer-desc">
  <title id="observer-title">Diagrama de Classes UML do padrão Observer</title>
  <desc id="observer-desc">CentralPedidos atualiza Pedido, que mantém observadores e os notifica por ObservadorPedido; Cliente e PainelExpedicao implementam a interface e consultam o pedido atualizado.</desc>
  <defs>
    <marker id="observer-triangulo" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="1 1,13 6,1 11" fill="#fff" stroke="#2d3142" stroke-width="1.4"/>
    </marker>
    <marker id="observer-aberta" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <polyline points="2 1,10 5,2 9" fill="none" stroke="#2d3142" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1024" height="504" fill="#fff"/>

  <!-- Associação: pedidos mantêm observadores com ciclo de vida independente. -->
  <path class="conector" d="M360 104 H520" marker-end="url(#observer-aberta)"/>
  <rect x="400" y="76" width="80" height="20" fill="#fff"/>
  <text class="rotulo" x="440" y="90">observadores</text>
  <rect x="372" y="112" width="32" height="16" fill="#fff"/>
  <text class="rotulo" x="388" y="124">0..*</text>
  <rect x="476" y="112" width="32" height="16" fill="#fff"/>
  <text class="rotulo" x="492" y="124">0..*</text>

  <!-- Dependência: a interface recebe o pedido atualizado. -->
  <path class="conector dependencia" d="M520 164 H360"/>
  <rect x="416" y="140" width="48" height="16" fill="#fff"/>
  <text class="rotulo" x="440" y="152">pedido</text>

  <!-- Realizações: caminhos separados para cada observador concreto. -->
  <path class="conector realizacao" d="M648 336 V200"/>
  <path class="conector realizacao" d="M964 336 V240 Q964 232 956 232 H848 Q840 232 840 224 V200"/>

  <!-- Dependência: CentralPedidos utiliza Pedido para atualizar o status. -->
  <path class="conector dependencia" d="M188 392 V288"/>

  <g id="observer-pedido">
    <rect x="16" y="16" width="344" height="272" rx="6" fill="#fff" stroke="#d9532f" stroke-width="1.6"/>
    <path d="M22 16 H354 Q360 16 360 22 V52 H16 V22 Q16 16 22 16" fill="#fbece6"/>
    <line x1="16" y1="52" x2="360" y2="52" stroke="#d9532f" stroke-width="1.2"/>
    <text class="nome" x="188" y="40">Pedido</text>
    <text class="membro" x="32" y="76">- codigo: String</text>
    <text class="membro" x="32" y="100">- status: String</text>
    <text class="membro" x="32" y="124">- observadores: Set&lt;ObservadorPedido&gt;</text>
    <line x1="16" y1="140" x2="360" y2="140" stroke="#d9532f" stroke-width="1.2"/>
    <text class="membro" x="32" y="164">+ Pedido(codigo: String)</text>
    <text class="membro" x="32" y="188">+ adicionarObservador(o: ObservadorPedido): void</text>
    <text class="membro" x="32" y="212">+ removerObservador(o: ObservadorPedido): void</text>
    <text class="membro" x="32" y="236">+ atualizarStatus(status: String): void</text>
    <text class="membro" x="32" y="260">- notificarObservadores(): void</text>
  </g>

  <g id="observer-interface">
    <rect class="caixa" x="520" y="64" width="384" height="136" rx="6"/>
    <path class="cabecalho" d="M526 64 H898 Q904 64 904 70 V112 H520 V70 Q520 64 526 64"/>
    <line class="divisoria" x1="520" y1="112" x2="904" y2="112"/>
    <text class="rotulo" x="712" y="84">«interface»</text>
    <text class="nome" x="712" y="100">ObservadorPedido</text>
    <text class="membro" x="536" y="152">+ atualizar(pedido: Pedido): void</text>
  </g>

  <g id="observer-central">
    <rect class="caixa" x="16" y="392" width="404" height="96" rx="6"/>
    <path class="cabecalho" d="M22 392 H414 Q420 392 420 398 V428 H16 V398 Q16 392 22 392"/>
    <line class="divisoria" x1="16" y1="428" x2="420" y2="428"/>
    <text class="nome" x="218" y="416">CentralPedidos</text>
    <text class="membro" x="32" y="464">+ atualizarStatus(pedido: Pedido, status: String): void</text>
  </g>

  <g id="observer-cliente">
    <rect class="caixa" x="488" y="336" width="248" height="152" rx="6"/>
    <path class="cabecalho" d="M494 336 H730 Q736 336 736 342 V372 H488 V342 Q488 336 494 336"/>
    <line class="divisoria" x1="488" y1="372" x2="736" y2="372"/>
    <text class="nome" x="612" y="360">Cliente</text>
    <text class="membro" x="504" y="396">- nome: String</text>
    <text class="membro" x="504" y="420">- ultimaNotificacao: String</text>
    <line class="divisoria" x1="488" y1="432" x2="736" y2="432"/>
    <text class="membro" x="504" y="456">+ Cliente(nome: String)</text>
    <text class="membro" x="504" y="476">+ atualizar(pedido: Pedido): void</text>
  </g>

  <g id="observer-painel">
    <rect class="caixa" x="760" y="336" width="248" height="128" rx="6"/>
    <path class="cabecalho" d="M766 336 H1002 Q1008 336 1008 342 V372 H760 V342 Q760 336 766 336"/>
    <line class="divisoria" x1="760" y1="372" x2="1008" y2="372"/>
    <text class="nome" x="884" y="360">PainelExpedicao</text>
    <text class="membro" x="776" y="400">- ultimaAtualizacao: String</text>
    <line class="divisoria" x1="760" y1="420" x2="1008" y2="420"/>
    <text class="membro" x="776" y="448">+ atualizar(pedido: Pedido): void</text>
  </g>
</svg>
</body>
</html>
